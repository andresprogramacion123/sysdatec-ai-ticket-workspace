<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Ticket Workspace</title>
    <link rel="stylesheet" href="css/style.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"
      integrity="sha512-WoViKhKD4qI2WruSZqv9+kvM4WfFhUMQCLN4QlDTt5aU56fLQy2gYoxWIqlEnXqJy/+Ac5q/hk1oWfqnMDhwMA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-text">
        <span class="logo-badge" aria-hidden="true">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"
            />
            <path d="M13 5v2" />
            <path d="M13 11v2" />
            <path d="M13 17v2" />
          </svg>
        </span>
        <div class="app-header-titles">
          <h1>AI Ticket Workspace</h1>
          <p class="subtitle">Dashboard de tickets</p>
        </div>
      </div>
      <button type="button" id="open-modal-button" class="btn btn-primary">
        + Nuevo ticket
      </button>
    </header>

    <main class="container">
      <section class="card">
        <div class="dashboard-toolbar">
          <h2>Tickets</h2>
          <p class="status-summary" id="status-summary"></p>
        </div>
        <p class="error-message" id="tickets-error"></p>

        <div class="charts-row">
          <div class="card chart-card">
            <h3 class="chart-title">Tickets por estado</h3>
            <div class="chart-canvas-wrapper">
              <canvas id="status-chart"></canvas>
            </div>
          </div>
          <div class="card chart-card">
            <h3 class="chart-title">Tickets por categoría</h3>
            <div class="chart-canvas-wrapper">
              <canvas id="category-chart"></canvas>
            </div>
          </div>
        </div>

        <div class="filter-bar">
          <div class="filter-field filter-search">
            <label for="search-input">Buscar cliente</label>
            <input type="search" id="search-input" placeholder="Nombre del cliente..." />
          </div>
          <div class="filter-field">
            <label for="category-filter">Categoría</label>
            <select id="category-filter">
              <option value="">Todas</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="priority-filter">Prioridad</label>
            <select id="priority-filter">
              <option value="">Todas</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="status-filter">Estado</label>
            <select id="status-filter">
              <option value="">Todos</option>
            </select>
          </div>
          <button type="button" id="clear-filters-button" class="btn btn-ghost">
            Limpiar filtros
          </button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th aria-sort="none">
                  <button type="button" class="th-content th-sort-button" data-sort-key="customer_name">
                    Cliente<span class="sort-arrow" aria-hidden="true"></span>
                  </button>
                </th>
                <th aria-sort="none">
                  <button type="button" class="th-content th-sort-button" data-sort-key="category">
                    Categoría<span class="sort-arrow" aria-hidden="true"></span>
                  </button>
                </th>
                <th aria-sort="none">
                  <button type="button" class="th-content th-sort-button" data-sort-key="priority">
                    Prioridad<span class="sort-arrow" aria-hidden="true"></span>
                  </button>
                </th>
                <th aria-sort="none">
                  <button type="button" class="th-content th-sort-button" data-sort-key="status">
                    Estado<span class="sort-arrow" aria-hidden="true"></span>
                  </button>
                </th>
                <th aria-sort="none">
                  <button type="button" class="th-content th-sort-button" data-sort-key="created_at">
                    Creado<span class="sort-arrow" aria-hidden="true"></span>
                  </button>
                </th>
                <th><span class="th-content">Acciones</span></th>
              </tr>
            </thead>
            <tbody id="tickets-body"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination">
          <button type="button" id="prev-page-button" class="btn btn-ghost">
            &larr; Anterior
          </button>
          <span class="pagination-info" id="pagination-info"></span>
          <button type="button" id="next-page-button" class="btn btn-ghost">
            Siguiente &rarr;
          </button>
        </div>
      </section>
    </main>

    <div class="modal-overlay" id="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <h2 id="modal-title">Nuevo ticket</h2>
          <button
            type="button"
            id="modal-close-button"
            class="modal-close-button"
            aria-label="Cerrar"
          >
            &times;
          </button>
        </div>

        <form id="create-ticket-form" novalidate>
          <div class="field">
            <label for="customer_name">Nombre del cliente</label>
            <input type="text" id="customer_name" name="customer_name" required />
          </div>
          <div class="field">
            <label for="request_text">Descripción de la solicitud</label>
            <textarea id="request_text" name="request_text" rows="4" required></textarea>
          </div>
          <div class="field">
            <label for="attachment_url">URL de adjunto (opcional)</label>
            <input
              type="url"
              id="attachment_url"
              name="attachment_url"
              placeholder="https://..."
            />
          </div>
          <div class="modal-actions">
            <button type="button" id="modal-cancel-button" class="btn btn-ghost">
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary">Crear ticket</button>
          </div>
          <p class="error-message" id="form-error"></p>
        </form>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
